[package]
name = "raster"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acadrust = { version = "0.5", default-features = false }
fax = "0.2"
flate2 = "1"
quick-xml = "0.42"
tiff = "0.11"
wasm-bindgen = "0.2"

# acadrust → ahash seeds its hasher from getrandom, which needs the browser's crypto API on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
