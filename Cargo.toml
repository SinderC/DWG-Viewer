[workspace]
members = ["crates/raster"]
resolver = "2"

[profile.release]
# Function names are only for stack traces; they were a third of the page.
strip = true
opt-level = 3
lto = true
codegen-units = 1

# DWG decoding runs once per file; optimising acadrust for size keeps the single-file build small.
[profile.release.package.acadrust]
opt-level = "z"
