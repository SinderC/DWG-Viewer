name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  # Called by pages.yml, which deploys the build.
  workflow_call:
    inputs:
      pages-artifact:
        description: Upload dist/ as a GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # wasm-bindgen-cli must match the wasm-bindgen crate version in Cargo.lock.
      - id: wasm-bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: cargo test
      - run: npm run build

      - if: inputs.pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
